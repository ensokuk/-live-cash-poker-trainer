<head>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }

    h1, h2, h3 { margin-top: 0; }

    .app {
      max-width: 760px;
      margin: 0 auto;
    }

    .card {
      background: #1e293b;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: #334155;
      color: #cbd5e1;
      font-size: 12px;
      margin-right: 6px;
      margin-bottom: 6px;
    }

    .spot-title {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .question {
      font-size: 17px;
      line-height: 1.45;
      color: #e2e8f0;
      white-space: pre-line;
    }

    .answers {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      background: #2563eb;
    }

    button.secondary {
      background: #475569;
    }

    button.good {
      background: #16a34a;
    }

    button.bad {
      background: #dc2626;
    }

    button:disabled {
      opacity: .55;
    }

    .feedback {
      margin-top: 16px;
      padding: 14px;
      border-radius: 14px;
      background: #0f172a;
      line-height: 1.45;
      display: none;
    }

    .feedback.show { display: block; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      background: #334155;
      border-radius: 14px;
      padding: 12px;
    }

    .stat strong {
      display: block;
      font-size: 22px;
    }

    .bar {
      height: 10px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: #22c55e;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      border-radius: 12px;
      border: 0;
      padding: 12px;
      font-size: 15px;
      background: #e2e8f0;
      color: #0f172a;
    }

    .small {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.4;
    }

    .hidden { display: none; }
  </style>
</head>

<body>
<div class="app">

  <h1>♠ Live Cash Poker Trainer</h1>
  <p class="small">Exploitatives Training für CHF 0.50/1 und 1/2 Home Games.</p>

  <div class="card">
    <div>
      <span class="badge" id="categoryBadge">Preflop</span>
      <span class="badge" id="difficultyBadge">Level</span>
      <span class="badge" id="progressBadge">1 / 50</span>
    </div>

    <h2 class="spot-title" id="spotTitle"></h2>
    <p class="question" id="question"></p>

    <div class="answers" id="answers"></div>

    <div class="feedback" id="feedback"></div>

    <button class="secondary hidden" id="nextBtn" onclick="nextSpot()">Nächste Situation</button>
  </div>

  <div class="card">
    <h3>Dein Leak-Profil</h3>

    <div class="stats-grid">
      <div class="stat"><strong id="score">0</strong>Richtige Entscheidungen</div>
      <div class="stat"><strong id="accuracy">0%</strong>Trefferquote</div>
      <div class="stat"><strong id="played">0</strong>Gespielte Spots</div>
      <div class="stat"><strong id="mainLeak">–</strong>Haupt-Leak</div>
    </div>

    <div class="bar"><div class="bar-fill" id="barFill"></div></div>

    <p class="small" id="leakText">Nach einigen Spots erkennt die App deine häufigsten Fehler.</p>
  </div>

  <div class="card">
    <h3>Handnotizen</h3>
    <textarea id="notes" placeholder="Eigene Hände oder Gedanken nach der Session notieren..."></textarea>
    <button class="secondary" onclick="saveNotes()">Notizen speichern</button>
    <p class="small" id="saveMsg"></p>
  </div>

  <div class="card">
    <button class="bad" onclick="resetTraining()">Training zurücksetzen</button>
  </div>

</div>

  let current = 0;

let stats = JSON.parse(localStorage.getItem("pokerTrainerStats")) || {
  correct: 0,
  played: 0,
  leaks: {}
};

function renderSpot() {

  if (current >= spots.length) {

    document.getElementById("spotTitle").innerText =
      "Training abgeschlossen";

    document.getElementById("question").innerText =
      "Sehr gut. Du hast alle verfügbaren Situationen gespielt.";

    document.getElementById("answers").innerHTML = "";

    document.getElementById("feedback").classList.add("show");
    document.getElementById("feedback").innerHTML =
      "🎉 Training beendet. Weitere Spots können später ergänzt werden.";

    document.getElementById("nextBtn").classList.add("hidden");

    updateDashboard();

    return;
  }

  const spot = spots[current];

  document.getElementById("spotTitle").innerText = spot.title;
  document.getElementById("question").innerText = spot.question;

  document.getElementById("categoryBadge").innerText =
    spot.category;

  document.getElementById("difficultyBadge").innerText =
    spot.difficulty;

  document.getElementById("progressBadge").innerText =
    `${current + 1} / ${spots.length}`;

  const answersDiv =
    document.getElementById("answers");

  answersDiv.innerHTML = "";

  spot.answers.forEach((answer, index) => {

    const btn = document.createElement("button");

    btn.innerText = answer;

    btn.onclick = () => evaluateAnswer(index);

    answersDiv.appendChild(btn);

  });

  document.getElementById("feedback").classList.remove("show");

  document.getElementById("nextBtn").classList.add("hidden");
}

function evaluateAnswer(choice) {

  const spot = spots[current];

  stats.played++;

  if (choice === spot.best) {

    stats.correct++;

  } else {

    if (!stats.leaks[spot.leak]) {
      stats.leaks[spot.leak] = 0;
    }

    stats.leaks[spot.leak]++;
  }

  localStorage.setItem(
    "pokerTrainerStats",
    JSON.stringify(stats)
  );

  const feedback =
    document.getElementById("feedback");

  const correct =
    choice === spot.best;

  feedback.classList.add("show");

  feedback.innerHTML =
    (correct ? "✅ <strong>Richtig</strong><br><br>" :
    "❌ <strong>Nicht optimal</strong><br><br>") +
    spot.explanation;

  document
    .querySelectorAll("#answers button")
    .forEach(btn => btn.disabled = true);

  document
    .getElementById("nextBtn")
    .classList.remove("hidden");

  updateDashboard();
}

function nextSpot() {

  current++;

  renderSpot();
}

function updateDashboard() {

  document.getElementById("score").innerText =
    stats.correct;

  document.getElementById("played").innerText =
    stats.played;

  const accuracy =
    stats.played === 0
      ? 0
      : Math.round(
          (stats.correct / stats.played) * 100
        );

  document.getElementById("accuracy").innerText =
    accuracy + "%";

  document.getElementById("barFill").style.width =
    accuracy + "%";

  let leakName = "Kein Leak erkannt";

  let maxCount = 0;

  Object.keys(stats.leaks).forEach(key => {

    if (stats.leaks[key] > maxCount) {

      maxCount = stats.leaks[key];
      leakName = key;
    }

  });

  document.getElementById("mainLeak").innerText =
    leakName;

  let recommendation = "";

  switch (leakName) {

    case "zu passiv":
      recommendation =
        "Du verpasst häufig Value. Trainiere Iso-Raises und aggressiveres Value Betting.";
      break;

    case "zu viele Hero Calls":
      recommendation =
        "Fokussiere dich stärker auf Gegnerprofile. Passive Spieler bluffen selten.";
      break;

    case "zu wenig Value Bets":
      recommendation =
        "Du lässt Geld liegen. Gegen Calling Stations dünner valuebetten.";
      break;

    case "schlechte Bluffs":
      recommendation =
        "Bluffe weniger gegen Spieler, die nicht folden.";
      break;

    case "Draws zu teuer callen":
      recommendation =
        "Verbessere Pot Odds und Implied Odds Verständnis.";
      break;

    case "zu loose early position":
      recommendation =
        "Spiele UTG und MP deutlich tighter.";
      break;

    case "Position unterschätzt":
      recommendation =
        "Nutze Button und Cutoff aggressiver.";
      break;

    default:
      recommendation =
        "Spiele weitere Spots für ein genaueres Leak-Profil.";
  }

  document.getElementById("leakText").innerText =
    recommendation;
}

function saveNotes() {

  localStorage.setItem(
    "pokerTrainerNotes",
    document.getElementById("notes").value
  );

  document.getElementById("saveMsg").innerText =
    "✅ Notizen gespeichert";
}

function loadNotes() {

  const notes =
    localStorage.getItem("pokerTrainerNotes");

  if (notes) {
    document.getElementById("notes").value = notes;
  }
}

function resetTraining() {

  if (!confirm("Wirklich zurücksetzen?")) return;

  localStorage.removeItem("pokerTrainerStats");
  localStorage.removeItem("pokerTrainerNotes");

  location.reload();
}

loadNotes();
updateDashboard();
renderSpot();

</script>
